<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mairo</title>
    <meta name="description" content="Mairo. Collection 01." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Aref+Ruqaa&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Hero: a looping film under small mono type, after the Latent studio hero.
         The name appears only as the drawn wordmarks, English bottom-left, Arabic bottom-right. -->
    <section class="hero" id="top">
      <div class="hv" aria-hidden="true">
        <video class="hv-v hv-d" muted loop playsinline autoplay preload="auto" poster="assets/hero/hero-poster.jpg">
          <source src="assets/hero/hero-loop.mp4" type="video/mp4" />
        </video>
        <video class="hv-v hv-m" muted loop playsinline autoplay preload="auto" poster="assets/hero/hero-poster-m.jpg">
          <source src="assets/hero/hero-loop-m.mp4" type="video/mp4" />
        </video>
        <i class="hv-grain"></i><i class="hv-grad"></i>
      </div>
      <div class="he">
        <!-- The wordmark pair where the headline was: English above Arabic, centred on each other. -->
        <div class="he-marks js-fade" style="--d:.15s">
          <img class="logo he-en" src="assets/logo/mairo-white.png" alt="Mairo" width="470" height="71" />
          <img class="logo he-ar" src="assets/logo/mairo-ar-white.png" alt="مايرو" width="339" height="113" />
        </div>
        <p class="he-line js-rise" style="--d:.55s" data-i18n="he.line">Activewear in four colours. Cut for hard sun.</p>
        <a class="he-br js-rise" href="#collection" style="--d:.8s" data-i18n="he.cta">The collection &#8595;</a>
      </div>
    </section>

    <header class="head" id="head">
      <nav class="head__nav">
        <a href="#shop" data-i18n="nav.shop">Shop</a>
        <a href="#collection" data-i18n="nav.sets">Sets</a>
        <a href="#campaign" data-i18n="nav.campaign">Campaign</a>
      </nav>
      <a class="head__mark" href="#top" aria-label="Mairo">
        <img class="logo" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
      </a>
      <div class="head__util">
        <a href="#" data-i18n="nav.search">Search</a>
        <button type="button" id="lang">العربية</button>
        <a href="#" data-i18n="nav.bag">Bag (0)</a>
      </div>
    </header>

    <main>

      <!-- The collection: one chapter per set. Images wipe up into place on scroll, the way the Latent site reveals its work. -->
      <section class="coll" id="collection">
        <header class="coll__head rv">
          <span class="coll__eyebrow lift" data-i18n="coll.eyebrow">Collection No. 01</span>
          <h2 class="coll__title hand lift" style="--d:.1s" data-i18n="coll.title">Four sets. One sun.</h2>
        </header>
        <div id="sets"></div>
      </section>

      <!-- Product listing -->
      <section class="shop" id="shop">
        <div class="shop__bar">
          <h2 class="hand" data-i18n="shop.title">Collection 01</h2>
          <div class="shop__filters" id="filters">
            <button type="button" data-f="all" aria-pressed="true" data-i18n="f.all">All</button>
            <button type="button" data-f="red" aria-pressed="false" data-i18n="c.red">Red</button>
            <button type="button" data-f="cream" aria-pressed="false" data-i18n="c.cream">Cream</button>
            <button type="button" data-f="pink" aria-pressed="false" data-i18n="c.pink">Pink</button>
            <button type="button" data-f="purple" aria-pressed="false" data-i18n="c.purple">Purple</button>
          </div>
        </div>
        <div class="grid" id="grid"></div>
      </section>

      <!-- Campaign: the moodboard prints, drag to scroll -->
      <section class="campaign" id="campaign">
        <div class="shop__bar">
          <h2 class="hand" data-i18n="campaign.title">Campaign</h2>
          <span class="muted" id="count">17</span>
        </div>
        <div class="strip" id="strip"></div>
      </section>
    </main>

    <footer class="foot">
      <div class="foot__cols">
        <div class="foot__col">
          <span class="muted" data-i18n="foot.lang">Language</span>
          <button type="button" class="foot__lang" id="lang2">English / العربية</button>
        </div>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.about">About</a></li>
          <li><a href="#" data-i18n="foot.contact">Contact</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.ig">Instagram</a></li>
          <li><a href="#" data-i18n="foot.shipping">Shipping</a></li>
          <li><a href="#" data-i18n="foot.returns">Returns</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.faq">FAQ</a></li>
          <li><a href="#" data-i18n="foot.legal">Legal &amp; Privacy</a></li>
        </ul>
        <form class="foot__col foot__news" onsubmit="return false">
          <label for="email" data-i18n="foot.news">Subscribe to the newsletter</label>
          <div class="foot__field">
            <input id="email" type="email" placeholder="Your email address" data-i18n-ph="foot.email" />
            <button type="submit" aria-label="Subscribe">&gt;</button>
          </div>
        </form>
      </div>
      <!-- English mark bottom-left, Arabic bottom-right. No studio credit. -->
      <div class="foot__base">
        <img class="logo foot__en" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
        <span class="muted">© <span id="year"></span></span>
        <img class="logo foot__ar" src="assets/logo/mairo-ar-black.png" alt="مايرو" width="339" height="113" />
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
