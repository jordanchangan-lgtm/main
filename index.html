<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALLOUK GROUP — Space Portal Landing</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/slides-data.js"></script>

  <style>
    :root { --bg: #000; --text: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      overflow-x: hidden;
    }

    #starfield {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    /* Very gentle vignette — no hard frame */
    .void-vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
    }

    /* Each slide is 500vh tall — 5 viewport scrolls. Inside, a sticky pin
       holds a viewport-sized frame fixed in place while the user scrolls
       through the slide, so text/images stay centred long enough to read. */
    .slide {
      position: relative;
      width: 100%;
      height: 500vh;
      z-index: 2;
    }

    .slide-pin {
      position: sticky;
      top: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    /* Stage matches the original PDF aspect ratio. It is NOT absolute now —
       it is centred inside the sticky pin and stays in the viewport while
       the slide is being scrolled through. */
    .slide-stage {
      position: relative;
      pointer-events: auto;
      /* width and height set by JS based on PDF page aspect & viewport */
    }

    .float-el {
      position: absolute;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      pointer-events: none;
    }

    .float-title {
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.1;
      color: #fff;
      text-shadow:
        0 0 20px var(--accent1, #6C63FF),
        0 0 50px rgba(0,0,0,0.85);
    }
    .float-text {
      line-height: 1.4;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.55);
      font-weight: 400;
    }
    .float-cn {
      line-height: 1.5;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
      font-weight: 300;
    }
    .float-img {
      /* soft drop-shadow only — no colored glow that would re-create a card feel */
      filter: drop-shadow(0 12px 35px rgba(0,0,0,0.55));
    }
    .float-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      /* no border-radius, no background — let the image be free in space */
    }

    /* Color accents per slide for subtle text glow only */
    .slide:nth-child(15n+1)  { --accent1: #6C63FF; }
    .slide:nth-child(15n+2)  { --accent1: #00D2FF; }
    .slide:nth-child(15n+3)  { --accent1: #FF6FD8; }
    .slide:nth-child(15n+4)  { --accent1: #00FF87; }
    .slide:nth-child(15n+5)  { --accent1: #FFD700; }
    .slide:nth-child(15n+6)  { --accent1: #FF4444; }
    .slide:nth-child(15n+7)  { --accent1: #00FFFF; }
    .slide:nth-child(15n+8)  { --accent1: #FF69B4; }
    .slide:nth-child(15n+9)  { --accent1: #ADFF2F; }
    .slide:nth-child(15n+10) { --accent1: #FF6347; }
    .slide:nth-child(15n+11) { --accent1: #7B68EE; }
    .slide:nth-child(15n+12) { --accent1: #40E0D0; }
    .slide:nth-child(15n+13) { --accent1: #FF1493; }
    .slide:nth-child(15n+14) { --accent1: #00FA9A; }
    .slide:nth-child(15n+15) { --accent1: #DA70D6; }

    .slide-counter {
      position: fixed; top: 14px; left: 14px; z-index: 5;
      color: rgba(255,255,255,0.85);
      font-family: monospace; letter-spacing: 2px;
      background: rgba(0,0,0,0.4);
      padding: 5px 10px; border-radius: 6px;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .scroll-hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5; color: rgba(255,255,255,0.65);
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      animation: bob 2s ease-in-out infinite;
      pointer-events: none;
      transition: opacity 0.6s;
    }
    @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }

    /* Mobile: drop the absolute % layout, let elements flow vertically */
    @media (max-width: 760px) {
      .slide { height: auto; min-height: 100vh; padding: 10vh 6vw; }
      .slide-pin { position: relative; height: auto; }
      .slide-stage {
        position: relative; left: auto; top: auto;
        transform: none;
        width: 100% !important; height: auto !important;
      }
      .float-el {
        position: relative !important;
        left: auto !important; top: auto !important;
        width: 100% !important;
        margin: 12px 0;
      }
      .float-title { font-size: 1.6rem !important; }
      .float-text, .float-cn { font-size: 1rem !important; }
      .float-img { height: auto !important; }
      .float-img img { max-height: 38vh; }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  <div class="void-vignette"></div>

  <div id="slidesRoot"></div>

  <div class="slide-counter">01 / 32</div>
  <div class="scroll-hint">scroll into the void</div>

  <script>
    // ---------- 3D Starfield + Nebula (Three.js) — unchanged ----------
    const canvas = document.getElementById('starfield');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000007, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000010, 0.00045);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 6000);
    camera.position.set(0, 0, 0);

    const STAR_COUNT = 12000;
    const SPACE_DEPTH = 3500;     // shorter slab — stars get recycled in tick()
    const SPACE_RADIUS = 900;     // tighter cylinder so stars fly past closer

    const positions = new Float32Array(STAR_COUNT * 3);
    const colors    = new Float32Array(STAR_COUNT * 3);
    const sizes     = new Float32Array(STAR_COUNT);
    const tmpColor = new THREE.Color();
    for (let i = 0; i < STAR_COUNT; i++) {
      const i3 = i * 3;
      // Mix of close-flyby stars and far-background stars so you visibly pass through
      const close = Math.random() < 0.35;
      const radius = close
        ? 40 + Math.pow(Math.random(), 1.4) * 240   // close band — these whip past you
        : 240 + Math.pow(Math.random(), 0.7) * SPACE_RADIUS;
      const angle = Math.random() * Math.PI * 2;
      positions[i3]     = Math.cos(angle) * radius;
      positions[i3 + 1] = Math.sin(angle) * radius;
      positions[i3 + 2] = -Math.random() * SPACE_DEPTH + 200;
      // Cool-white palette: navy / violet / off-white, occasional warm spec
      const warm = Math.random() < 0.05;
      const hue = warm ? 0.04 + Math.random() * 0.08 : 0.6 + Math.random() * 0.18;
      tmpColor.setHSL(hue, 0.55, 0.6 + Math.random() * 0.4);
      colors[i3] = tmpColor.r; colors[i3 + 1] = tmpColor.g; colors[i3 + 2] = tmpColor.b;
      sizes[i] = (close ? 1.4 : 1.0) + Math.random() * 1.6;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    starGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    starGeo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

    const starMat = new THREE.ShaderMaterial({
      uniforms: {
        uPixelRatio: { value: renderer.getPixelRatio() },
        uVelocity:   { value: 0.0 },
        uTime:       { value: 0.0 }
      },
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aSize;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uPixelRatio;
        uniform float uVelocity;
        uniform float uTime;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          float perspective = 320.0 / max(1.0, -mv.z);
          float twinkle = 0.85 + 0.15 * sin(uTime * 2.0 + position.x * 0.3 + position.y * 0.5);
          float warp = 1.0 + abs(uVelocity) * 0.8;
          gl_PointSize = aSize * perspective * uPixelRatio * twinkle * warp;
          vAlpha = clamp(1.0 - smoothstep(2500.0, 5500.0, -mv.z), 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          float core  = smoothstep(0.5, 0.0, d);
          float halo  = smoothstep(0.5, 0.15, d) * 0.4;
          float a = (core + halo) * vAlpha;
          gl_FragColor = vec4(vColor, a);
        }
      `
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    // ===== Per-slide universes — each slide gets its own nebula cluster, =====
    //       sometimes spiral galaxies, and a black-hole portal between it and the next.
    //       Camera flies through them all on a single forward path.

    const SLIDE_COUNT_3D = (window.SLIDES || []).length || 32;
    const SLIDE_DEPTH = 1500;                              // z-units per slide
    const TOTAL_DEPTH = SLIDE_COUNT_3D * SLIDE_DEPTH;      // total flight distance

    // Palette: navy + purple + grey only, with a few intra-family shades
    const NEBULA_PALETTE = [
      [22, 28, 70],     // deep navy
      [40, 50, 110],    // navy
      [70, 90, 170],    // navy-light
      [60, 30, 110],    // deep purple
      [100, 60, 170],   // purple
      [150, 100, 220],  // purple-light
      [80, 80, 100],    // cool grey
      [130, 130, 150],  // grey
      [180, 180, 200],  // light grey
    ];

    // Wispier nebula: base radial gradient + a handful of random sub-blobs
    function makeNebulaTexture(r, g, b, randFn) {
      const rand = randFn || Math.random;
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const x = cv.getContext('2d');
      const g1 = x.createRadialGradient(128, 128, 0, 128, 128, 128);
      g1.addColorStop(0,    `rgba(${r},${g},${b},0.95)`);
      g1.addColorStop(0.3,  `rgba(${r},${g},${b},0.45)`);
      g1.addColorStop(0.7,  `rgba(${r},${g},${b},0.08)`);
      g1.addColorStop(1,    `rgba(${r},${g},${b},0)`);
      x.fillStyle = g1; x.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 18; i++) {
        const px = 30 + rand() * 196;
        const py = 30 + rand() * 196;
        const pr = 20 + rand() * 50;
        const grad = x.createRadialGradient(px, py, 0, px, py, pr);
        grad.addColorStop(0, `rgba(${r},${g},${b},${0.25 + rand() * 0.35})`);
        grad.addColorStop(1, `rgba(${r},${g},${b},0)`);
        x.fillStyle = grad; x.fillRect(0, 0, 256, 256);
      }
      return new THREE.CanvasTexture(cv);
    }

    // Deterministic PRNG so each slide's universe is stable across reloads
    function srand(seed) {
      let s = seed | 0;
      return function() {
        s = (s * 1664525 + 1013904223) | 0;
        return ((s >>> 0) % 100000) / 100000;
      };
    }

    const nebulae = [];
    const galaxies = [];
    const portals = [];
    const slideAnchors = [];   // per-slide camera reference data

    for (let s = 0; s < SLIDE_COUNT_3D; s++) {
      const rand = srand(s * 977 + 31);
      const slideZ = -s * SLIDE_DEPTH;

      // Pick 3 colours from the palette deterministically
      const c1 = NEBULA_PALETTE[Math.floor(rand() * NEBULA_PALETTE.length)];
      const c2 = NEBULA_PALETTE[Math.floor(rand() * NEBULA_PALETTE.length)];
      const c3 = NEBULA_PALETTE[Math.floor(rand() * NEBULA_PALETTE.length)];

      // Random "entrance flavour" so each slide approach feels different
      slideAnchors.push({
        z: slideZ,
        rollSeed: rand() * Math.PI * 2,
        rollDir: rand() > 0.5 ? 1 : -1,
        driftXAmp: 30 + rand() * 90,
        driftYAmp: 20 + rand() * 70,
        driftXFreq: 0.04 + rand() * 0.07,
        driftYFreq: 0.03 + rand() * 0.06,
      });

      // (Foggy nebula sprites removed — each universe is now defined by its
      // single galaxy + the deep-void starfield. No more square fog blobs.)

      // Each universe contains exactly one spiral galaxy in its theme colours.
      const galCount = 1;
      for (let g = 0; g < galCount; g++) {
        const colArr  = [c1, c2, c3][g % 3];
        const accent  = [c1, c2, c3][(g + 1) % 3];
        const coreCol = new THREE.Color(
          Math.min(1, colArr[0]/255 + 0.35),
          Math.min(1, colArr[1]/255 + 0.30),
          Math.min(1, colArr[2]/255 + 0.40)
        );
        const edgeCol = new THREE.Color(accent[0]/255, accent[1]/255, accent[2]/255).multiplyScalar(0.6);

        const galaxyGroup = new THREE.Group();
        // Position closer to the camera path so the galaxy is the centrepiece
        // of the universe rather than an off-screen prop
        galaxyGroup.position.set(
          (rand() - 0.5) * 700,
          (rand() - 0.5) * 450,
          slideZ + (rand() - 0.5) * SLIDE_DEPTH * 0.4
        );
        // Random galaxy attitude — face-on, edge-on, or anything in between
        galaxyGroup.rotation.set(
          (rand() - 0.5) * Math.PI,
          (rand() - 0.5) * Math.PI,
          (rand() - 0.5) * Math.PI
        );

        const outerR    = 320 + rand() * 280;          // bigger disc — only 1 per slide
        const innerR    = outerR * 0.04;
        const numArms   = 2 + Math.floor(rand() * 3);  // 2-4 arms
        const tightness = 4 + rand() * 4;             // spiral pitch
        const thickness = outerR * 0.03;
        const PARTICLES = 1800 + Math.floor(rand() * 800);

        const gPos = new Float32Array(PARTICLES * 3);
        const gCol = new Float32Array(PARTICLES * 3);
        const gSiz = new Float32Array(PARTICLES);
        const tmp  = new THREE.Color();

        for (let i = 0; i < PARTICLES; i++) {
          const arm = i % numArms;
          const tBase = Math.pow(rand(), 0.6);   // bias toward edge so disc isn't core-heavy
          const t = tBase;
          const armAngle = arm * (Math.PI * 2 / numArms);
          const angle = t * tightness + armAngle + (rand() - 0.5) * 0.45;
          const radial = innerR + t * (outerR - innerR);
          // perpendicular spread from the arm, narrower on the outside
          const armSpread = (rand() - 0.5) * outerR * 0.18 * (1 - t * 0.5);
          const r = radial + armSpread;
          const ax = Math.cos(angle) * r;
          const az = Math.sin(angle) * r;
          // disc thickness — falls off toward edge so galaxy looks flat
          const ay = (rand() - 0.5) * thickness * (1 - Math.pow(t, 0.7));

          gPos[i*3]     = ax;
          gPos[i*3 + 1] = ay;
          gPos[i*3 + 2] = az;

          // colour: bright core → dim edge, with grey/violet variation per particle
          tmp.copy(coreCol).lerp(edgeCol, t);
          // sprinkle grey stars for variation
          if (rand() < 0.12) {
            tmp.setRGB(0.7 + rand() * 0.2, 0.7 + rand() * 0.2, 0.78 + rand() * 0.2);
          }
          gCol[i*3]     = tmp.r;
          gCol[i*3 + 1] = tmp.g;
          gCol[i*3 + 2] = tmp.b;

          gSiz[i] = (2.4 - t * 1.6) * (0.6 + rand() * 0.8);
        }

        const gGeo = new THREE.BufferGeometry();
        gGeo.setAttribute('position', new THREE.BufferAttribute(gPos, 3));
        gGeo.setAttribute('color',    new THREE.BufferAttribute(gCol, 3));
        gGeo.setAttribute('aSize',    new THREE.BufferAttribute(gSiz, 1));
        const galaxyDisc = new THREE.Points(gGeo, starMat);
        galaxyGroup.add(galaxyDisc);

        // Bright glowing core (additive sprite, lavender-tinted)
        const coreTex = makeNebulaTexture(
          Math.min(255, colArr[0] + 90),
          Math.min(255, colArr[1] + 80),
          Math.min(255, colArr[2] + 100),
          rand
        );
        const core = new THREE.Sprite(new THREE.SpriteMaterial({
          map: coreTex,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false,
          opacity: 0.9
        }));
        core.scale.set(outerR * 0.8, outerR * 0.8, 1);
        galaxyGroup.add(core);

        // Outer wispy halo so the galaxy bleeds into the void
        const haloTex = makeNebulaTexture(colArr[0], colArr[1], colArr[2], rand);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: haloTex,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false,
          opacity: 0.4
        }));
        halo.scale.set(outerR * 2.6, outerR * 2.6, 1);
        galaxyGroup.add(halo);

        // Slow rotation around its own up-axis (the disc's local Y)
        galaxyGroup.userData.spinSpeed = (rand() - 0.5) * 0.0015;
        galaxyGroup.userData.disc = galaxyDisc;

        scene.add(galaxyGroup);
        galaxies.push(galaxyGroup);
      }

      // Black-hole portal between this slide and the next one
      if (s < SLIDE_COUNT_3D - 1) {
        const portalZ = slideZ - SLIDE_DEPTH * 0.85; // sits just before the next slide's nebula
        const grp = new THREE.Group();
        grp.position.set(
          (rand() - 0.5) * 220,
          (rand() - 0.5) * 160,
          portalZ
        );
        // Random tilt — gives every portal a unique entry attitude
        grp.rotation.set(
          (rand() - 0.5) * 0.7,
          (rand() - 0.5) * 0.7,
          rand() * Math.PI * 2
        );
        // Event horizon — dark sphere
        const core = new THREE.Mesh(
          new THREE.SphereGeometry(38, 32, 32),
          new THREE.MeshBasicMaterial({ color: 0x000004, transparent: true, opacity: 0.97 })
        );
        grp.add(core);
        // Accretion ring (additive torus glow)
        const ringCol = NEBULA_PALETTE[Math.floor(rand() * NEBULA_PALETTE.length)];
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(58, 4, 16, 100),
          new THREE.MeshBasicMaterial({
            color: new THREE.Color(ringCol[0]/255, ringCol[1]/255, ringCol[2]/255),
            transparent: true,
            opacity: 0.9
          })
        );
        ring.rotation.x = Math.PI / 2;
        grp.add(ring);
        // Outer wispy halo
        const haloTex = makeNebulaTexture(ringCol[0], ringCol[1], ringCol[2], rand);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({
          map: haloTex,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false,
          opacity: 0.7
        }));
        halo.scale.set(300, 300, 1);
        grp.add(halo);
        grp.userData.spin = 0.01 + rand() * 0.025;
        grp.userData.ringRef = ring;
        scene.add(grp);
        portals.push(grp);
      }
    }

    // ===== Camera flight + black-hole transition feel =====
    let scrollVel = 0;
    let lastY = window.scrollY;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      scrollVel += (y - lastY) * 0.0025;
      scrollVel = Math.max(-3, Math.min(3, scrollVel));
      lastY = y;
    }, { passive: true });

    function getScrollProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max > 0 ? Math.max(0, Math.min(1, window.scrollY / max)) : 0;
    }

    const baseFOV = 72;

    function tick(t) {
      const time = t * 0.001;
      starMat.uniforms.uTime.value = time;

      // Global scroll → position along the flight path
      const sp = getScrollProgress();
      const slideF = sp * Math.max(1, SLIDE_COUNT_3D - 1);
      const slideIdx = Math.min(SLIDE_COUNT_3D - 1, Math.floor(slideF));
      const subP = slideF - slideIdx;     // 0..1 within the current slide

      // Transition weight peaks ~70-90% through each slide (when you're falling
      // toward the black hole) — drives FOV pulse, warp, and roll.
      // Smooth pull curve (smoothstep) — kicks in around 65% of the slide
      // and reaches 1 at the boundary. No abrupt acceleration.
      const pullX = Math.max(0, Math.min(1, (subP - 0.65) / 0.35));
      const blackHolePull = pullX * pullX * (3 - 2 * pullX);

      // Camera Z runs the full depth of all slide universes
      camera.position.z = -sp * (TOTAL_DEPTH - SLIDE_DEPTH);

      // Per-slide drift profile (the "randomized entrance" — every slide
      // approaches with a slightly different roll/x/y signature)
      const a = slideAnchors[slideIdx] || slideAnchors[0];
      camera.position.x = Math.sin(time * a.driftXFreq + a.rollSeed) * a.driftXAmp
                       + Math.sin(time * 0.07 + slideIdx * 0.9) * blackHolePull * 60;
      camera.position.y = Math.cos(time * a.driftYFreq + a.rollSeed * 0.7) * a.driftYAmp
                       + Math.cos(time * 0.05 + slideIdx * 1.3) * blackHolePull * 45;

      // Roll spirals as you approach a black hole — direction varies per slide
      camera.rotation.z = Math.sin(time * 0.1) * 0.04
                        + scrollVel * 0.04
                        + a.rollDir * Math.pow(blackHolePull, 1.4) * 0.55;

      // FOV narrows during the pull (tunnel-vision into the hole), then snaps
      // back at the start of the next slide
      const targetFOV = baseFOV - blackHolePull * 18;
      camera.fov += (targetFOV - camera.fov) * 0.05;   // gentler lerp, smoother feel
      camera.updateProjectionMatrix();

      // Star streaks intensify as you fall in
      starMat.uniforms.uVelocity.value = scrollVel + blackHolePull * 2.6;

      // Recycle stars: any star that has slipped behind the camera gets
      // teleported far ahead of the camera so the user always feels like
      // they're flying through a fresh field. Without this, after the first
      // slab of stars passes the camera you'd be flying through empty space.
      const starPos = stars.geometry.attributes.position;
      const starArr = starPos.array;
      const camZ = camera.position.z;
      const camX = camera.position.x;
      const camY = camera.position.y;
      const recycleBehind = 250;     // z distance behind cam at which we recycle
      const aheadStart    = SPACE_DEPTH;
      let needsUpdate = false;
      for (let i = 0; i < STAR_COUNT; i++) {
        const i3 = i * 3;
        if (starArr[i3 + 2] > camZ + recycleBehind) {
          // re-spawn ahead of camera in the same close-or-far distribution
          const close = Math.random() < 0.35;
          const radius = close
            ? 40 + Math.pow(Math.random(), 1.4) * 240
            : 240 + Math.pow(Math.random(), 0.7) * SPACE_RADIUS;
          const angle = Math.random() * Math.PI * 2;
          starArr[i3]     = camX + Math.cos(angle) * radius;
          starArr[i3 + 1] = camY + Math.sin(angle) * radius;
          starArr[i3 + 2] = camZ - aheadStart - Math.random() * 200;
          needsUpdate = true;
        }
      }
      if (needsUpdate) starPos.needsUpdate = true;
      // Galaxies rotate slowly around their own up-axis (the disc spins)
      for (const g of galaxies) {
        if (g.userData.disc) {
          g.userData.disc.rotation.y += g.userData.spinSpeed;
        }
      }
      // Portals spin; ring glow pulses brighter when camera is near
      for (const portal of portals) {
        portal.rotation.z += portal.userData.spin;
        const dz = camera.position.z - portal.position.z;
        const near = Math.max(0, 1 - Math.abs(dz) / (SLIDE_DEPTH * 0.7));
        if (portal.userData.ringRef) {
          portal.userData.ringRef.material.opacity = 0.55 + 0.45 * near;
          portal.userData.ringRef.scale.setScalar(1 + near * 0.4);
        }
      }

      scrollVel *= 0.92;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      starMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    });

    // ---------- Build slides from window.SLIDES (PyMuPDF-positioned) ----------
    const SLIDES = window.SLIDES || [];
    const TOTAL = SLIDES.length;
    const slidesRoot = document.getElementById('slidesRoot');

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    SLIDES.forEach((slide, i) => {
      const sec = document.createElement('section');
      sec.className = 'slide';
      sec.setAttribute('data-index', i);
      sec.dataset.pageW = slide.pageW;
      sec.dataset.pageH = slide.pageH;

      const stage = document.createElement('div');
      stage.className = 'slide-stage';
      stage.dataset.ar = (slide.pageW / slide.pageH).toFixed(4);

      slide.elements.forEach((el, ei) => {
        const div = document.createElement('div');
        div.className = 'float-el ' + (
          el.type === 'title' ? 'float-title' :
          el.type === 'cn'    ? 'float-cn'    :
          el.type === 'img'   ? 'float-img'   : 'float-text'
        );
        div.style.left  = el.x + '%';
        div.style.top   = el.y + '%';
        div.style.width = el.w + '%';
        if (el.type === 'img' && el.h) {
          div.style.height = el.h + '%';
        }
        if (el.fs != null) {
          div.dataset.fs = el.fs;          // PDF point size, used to compute px on layout
        }
        div.dataset.depth = el.depth || 800;
        div.dataset.idx = ei;

        if (el.type === 'img') {
          const img = document.createElement('img');
          img.src = el.src;
          img.loading = 'lazy';
          img.alt = '';
          img.onerror = () => { div.style.display = 'none'; };
          div.appendChild(img);
        } else {
          div.textContent = el.text;
        }
        stage.appendChild(div);
      });

      // Wrap stage in a sticky pin so text/images stay visible in the centre
      // of the viewport while the user scrolls through this slide.
      const pin = document.createElement('div');
      pin.className = 'slide-pin';
      pin.appendChild(stage);
      sec.appendChild(pin);
      slidesRoot.appendChild(sec);
    });

    // ===== 3D particle logo for slide 1 (replaces the HTML title) =====
    // Hide the HTML title on slide 1 — the 3D particles are the title now.
    (function hideSlide1Title() {
      const first = document.querySelector('.slide[data-index="0"]');
      if (!first) return;
      first.querySelectorAll('.float-title').forEach(t => { t.style.display = 'none'; });
    })();

    // Build a particle cloud from rasterised text
    function makeParticleLogo(text, opts) {
      opts = opts || {};
      const fontPx     = opts.fontPx     || 140;
      const sampleStep = opts.sampleStep || 3;          // smaller = more particles
      const worldScale = opts.worldScale || 0.55;       // px → world unit
      const anchor     = opts.anchor     || new THREE.Vector3(0, 0, -200);
      const lineGap    = opts.lineGap    || 1.18;

      // Render text on a hidden 2D canvas — supports multi-line
      const lines = Array.isArray(text) ? text : [text];
      const cv = document.createElement('canvas');
      cv.width  = 1600;
      cv.height = Math.max(280, fontPx * lines.length * lineGap + 80);
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.font = `800 ${fontPx}px system-ui, -apple-system, "Segoe UI", Roboto, Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const totalH = fontPx * lines.length * lineGap;
      lines.forEach((line, idx) => {
        const y = (cv.height - totalH) / 2 + (idx + 0.5) * fontPx * lineGap;
        ctx.fillText(line, cv.width / 2, y);
      });

      const data = ctx.getImageData(0, 0, cv.width, cv.height).data;
      const pos = [], col = [], siz = [], target = [];
      // Theme palette: navy / purple / grey
      const logoPalette = [
        [150, 110, 220],
        [80, 100, 190],
        [200, 200, 220],
        [70, 60, 140]
      ];
      for (let py = 0; py < cv.height; py += sampleStep) {
        for (let px = 0; px < cv.width; px += sampleStep) {
          const i = (py * cv.width + px) * 4;
          if (data[i + 3] > 128) {
            const wx = (px - cv.width / 2)  * worldScale + anchor.x;
            const wy = -(py - cv.height / 2) * worldScale + anchor.y;
            const wz = anchor.z + (Math.random() - 0.5) * 14;
            pos.push(wx, wy, wz);
            target.push(wx, wy, anchor.z);
            const c = logoPalette[(Math.random() * logoPalette.length) | 0];
            col.push(c[0]/255, c[1]/255, c[2]/255);
            siz.push(1.4 + Math.random() * 1.6);
          }
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
      geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(col), 3));
      geo.setAttribute('aSize',    new THREE.BufferAttribute(new Float32Array(siz), 1));
      const points = new THREE.Points(geo, starMat);  // share star shader for additive glow
      points.userData.targets = new Float32Array(target);
      points.userData.count = pos.length / 3;
      points.userData.phase = new Float32Array(points.userData.count);
      for (let i = 0; i < points.userData.count; i++) {
        points.userData.phase[i] = Math.random() * Math.PI * 2;
      }
      return points;
    }

    // Place logo near the front of the camera path (slide 1 anchor at z=0)
    const logoZ = -260;     // slightly ahead of camera start so it's visible at scroll=0
    const malloukLogo = makeParticleLogo(
      ['MALLOUK', 'GROUP'],
      {
        fontPx: 180,
        sampleStep: 3,
        worldScale: 0.55,
        anchor: new THREE.Vector3(0, 0, logoZ),
        lineGap: 1.05
      }
    );
    scene.add(malloukLogo);

    // Idle drift animation for the logo particles — runs in the existing tick loop
    // via this hook (added so we don't need to edit tick() again)
    (function attachLogoDrift() {
      const positions = malloukLogo.geometry.attributes.position;
      const targets   = malloukLogo.userData.targets;
      const phases    = malloukLogo.userData.phase;
      const count     = malloukLogo.userData.count;
      function loop(now) {
        const t = now * 0.001;
        const arr = positions.array;
        for (let i = 0; i < count; i++) {
          const ph = phases[i];
          arr[i*3]     = targets[i*3]     + Math.sin(t * 0.6 + ph)        * 2.0;
          arr[i*3 + 1] = targets[i*3 + 1] + Math.cos(t * 0.5 + ph * 1.3)  * 2.0;
          arr[i*3 + 2] = targets[i*3 + 2] + Math.sin(t * 0.35 + ph * 0.7) * 3.0;
        }
        positions.needsUpdate = true;
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    })();

    // ---------- Stage sizing: match PDF aspect to viewport, scale fonts ----------
    function layoutStages() {
      const isMobile = window.innerWidth <= 760;
      if (isMobile) {
        // CSS handles flow layout; only need to clear inline sizes
        document.querySelectorAll('.slide-stage').forEach(s => {
          s.style.width = ''; s.style.height = '';
        });
        document.querySelectorAll('[data-fs]').forEach(el => { el.style.fontSize = ''; });
        return;
      }
      const maxW = window.innerWidth * 0.92;
      const maxH = window.innerHeight * 0.86;
      document.querySelectorAll('.slide-stage').forEach(stage => {
        const ar = parseFloat(stage.dataset.ar) || 1.333;
        let w, h;
        if (maxW / ar <= maxH) { w = maxW; h = maxW / ar; }
        else                   { h = maxH; w = maxH * ar; }
        stage.style.width  = w + 'px';
        stage.style.height = h + 'px';

        const slideEl = stage.closest('.slide');
        const pageWpts = parseFloat(slideEl && slideEl.dataset.pageW) || 1152;
        stage.querySelectorAll('[data-fs]').forEach(el => {
          const fs = parseFloat(el.dataset.fs);
          // px = pt × stageWidth / pageWidth
          el.style.fontSize = (fs * w / pageWpts).toFixed(2) + 'px';
        });
      });
    }
    layoutStages();
    window.addEventListener('resize', layoutStages);

    // ---------- Continuous emerge-from-void animation per element ----------
    gsap.registerPlugin(ScrollTrigger);

    // Per-slide master timeline. Slide is 500vh; the sticky pin keeps the
    // stage in the middle of the viewport while the timeline runs.
    //   0  – 25 %  EMERGE  text & images come out of the void into the centre
    //   25 – 70 %  HOLD    everything is sharp and centred — read time
    //   70 – 100 % DISSOLVE elements scale up + blur away into the next universe
    document.querySelectorAll('.slide').forEach((slide) => {
      const elements = Array.from(slide.querySelectorAll('.float-el'));
      if (!elements.length) return;

      const tl = gsap.timeline({
        defaults: { ease: 'power2.out' },
        scrollTrigger: {
          trigger: slide,
          start: 'top top',
          end:   'bottom bottom',
          scrub: 1.2
        }
      });

      // EMERGE: 0 → 0.25
      elements.forEach((el, i) => {
        const depth = parseFloat(el.dataset.depth) || 800;
        const stagger = i * 0.008;     // tight stagger so they emerge as a group
        tl.fromTo(el,
          {
            opacity: 0,
            scale: Math.max(0.3, 1 - depth / 2400),
            y: 60,
            filter: `blur(${Math.min(26, depth / 40)}px)`
          },
          {
            opacity: 1,
            scale: 1,
            y: 0,
            filter: 'blur(0px)',
            duration: 0.18
          },
          0.02 + stagger
        );
      });

      // HOLD: a no-op tween from 0.25 → 0.70 (timeline pads the gap automatically
      // because the next group of tweens starts at 0.70)

      // DISSOLVE: 0.70 → 1.0 — fade and blow up into the next universe
      elements.forEach((el, i) => {
        const stagger = i * 0.005;
        tl.to(el, {
          opacity: 0,
          scale: 1.45,
          y: -90,
          filter: 'blur(22px)',
          duration: 0.22,
          ease: 'power2.in'
        }, 0.72 + stagger);
      });
    });

    // ---------- Progress bar + counter ----------
    const progressBar = document.createElement('div');
    Object.assign(progressBar.style, {
      position: 'fixed', top: '0', left: '0', height: '2px',
      background: 'linear-gradient(90deg, #6C63FF, #00D2FF, #FF6FD8, #00FF87, #FFD700, #FF1493)',
      width: '0%', zIndex: '999', transition: 'width 0.05s linear'
    });
    document.body.appendChild(progressBar);

    const counterEl = document.querySelector('.slide-counter');
    const hintEl = document.querySelector('.scroll-hint');
    function updateProgress() {
      const st = window.pageYOffset;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max ? (st / max) * 100 : 0;
      progressBar.style.width = p + '%';
      const idx = Math.min(TOTAL - 1, Math.round(st / window.innerHeight));
      if (counterEl) {
        counterEl.textContent =
          String(idx + 1).padStart(2, '0') + ' / ' + String(TOTAL).padStart(2, '0');
      }
      if (hintEl) hintEl.style.opacity = st > 80 ? '0' : '1';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);

    // ---------- First-load: re-layout & refresh ScrollTriggers once images load ----------
    // (No per-element entrance here — the per-slide timeline handles emergence
    // as soon as the user starts scrolling.)
    window.addEventListener('load', () => {
      layoutStages();
      updateProgress();
      ScrollTrigger.refresh();
    });
  </script>
</body>
</html>
