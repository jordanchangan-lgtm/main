<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALLOUK GROUP — Space Portal Landing</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    :root { --bg: #000; --text: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      overflow-x: hidden;
    }

    #starfield {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    .portal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.75) 100%);
    }

    .slide {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
    }

    .slide-card {
      position: relative;
      max-width: min(92vw, 1280px);
      max-height: 86vh;
      aspect-ratio: 16 / 9;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      will-change: transform, opacity;
    }
    .slide-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.06),
        0 30px 80px rgba(0,0,0,0.7),
        0 0 60px var(--accent1, #6C63FF);
      background: rgba(10, 10, 30, 0.6);
    }

    .slide-title {
      position: absolute;
      top: 6vh; left: 6vw; right: 6vw;
      z-index: 3;
      font-size: clamp(0.85rem, 1.6vw, 1.1rem);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      text-shadow: 0 0 20px var(--accent1, #6C63FF);
      pointer-events: none;
      will-change: transform, opacity;
      display: flex;
      justify-content: space-between;
      gap: 16px;
    }
    .slide-title .num { opacity: 0.6; }
    .slide-title .name { font-weight: 600; }

    /* Portal ring sits behind the slide card */
    .portal-ring {
      position: absolute;
      width: 60vmin;
      height: 60vmin;
      border-radius: 50%;
      border: 2px solid var(--accent1, #6C63FF);
      box-shadow: 0 0 80px var(--accent1, #6C63FF), inset 0 0 60px var(--accent1, #6C63FF);
      opacity: 0;
      transform: translate(-50%, -50%) scale(0);
      left: 50%; top: 50%;
      pointer-events: none;
      z-index: 1;
      will-change: transform, opacity;
    }
    .portal-ring::before, .portal-ring::after {
      content: '';
      position: absolute;
      border-radius: 50%;
    }
    .portal-ring::before {
      inset: -10px;
      border: 1px solid var(--accent2, #3F3D9E);
      animation: portalSpin 8s linear infinite;
      opacity: 0.55;
    }
    .portal-ring::after {
      inset: 18px;
      border: 1px dashed var(--accent1, #6C63FF);
      animation: portalSpin 12s linear infinite reverse;
      opacity: 0.35;
    }
    @keyframes portalSpin { to { transform: rotate(360deg); } }

    .nebula-glow {
      position: absolute; inset: 0;
      background: radial-gradient(circle at center, var(--accent1, #6C63FF) 0%, transparent 55%);
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      filter: blur(80px);
      mix-blend-mode: screen;
      will-change: opacity;
    }

    /* 32-slide accent palette (cycles around the wheel) */
    .slide:nth-child(15n+1)  { --accent1: #6C63FF; --accent2: #3F3D9E; }
    .slide:nth-child(15n+2)  { --accent1: #00D2FF; --accent2: #0083B0; }
    .slide:nth-child(15n+3)  { --accent1: #FF6FD8; --accent2: #9B3DB5; }
    .slide:nth-child(15n+4)  { --accent1: #00FF87; --accent2: #00A86B; }
    .slide:nth-child(15n+5)  { --accent1: #FFD700; --accent2: #FF8C00; }
    .slide:nth-child(15n+6)  { --accent1: #FF4444; --accent2: #CC0000; }
    .slide:nth-child(15n+7)  { --accent1: #00FFFF; --accent2: #008B8B; }
    .slide:nth-child(15n+8)  { --accent1: #FF69B4; --accent2: #C71585; }
    .slide:nth-child(15n+9)  { --accent1: #ADFF2F; --accent2: #6B8E23; }
    .slide:nth-child(15n+10) { --accent1: #FF6347; --accent2: #B22222; }
    .slide:nth-child(15n+11) { --accent1: #7B68EE; --accent2: #483D8B; }
    .slide:nth-child(15n+12) { --accent1: #40E0D0; --accent2: #20B2AA; }
    .slide:nth-child(15n+13) { --accent1: #FF1493; --accent2: #8B0A50; }
    .slide:nth-child(15n+14) { --accent1: #00FA9A; --accent2: #2E8B57; }
    .slide:nth-child(15n+15) { --accent1: #DA70D6; --accent2: #9932CC; }

    .slide-counter {
      position: fixed; top: 14px; left: 14px; z-index: 5;
      color: #fff; font-family: monospace; letter-spacing: 2px;
      background: rgba(0,0,0,0.45);
      padding: 6px 10px; border-radius: 6px;
      font-size: 12px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .scroll-hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5; color: rgba(255,255,255,0.7);
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      animation: bob 2s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }

    @media (max-width: 700px) {
      .slide-card { max-width: 94vw; max-height: 70vh; }
      .slide-title { font-size: 0.75rem; letter-spacing: 2px; top: 3vh; }
      .portal-ring { width: 90vmin; height: 90vmin; }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  <div class="portal-overlay"></div>

  <div id="slidesRoot"></div>

  <div class="slide-counter">01 / 32</div>
  <div class="scroll-hint">scroll to enter</div>

  <script>
    // ---------- Starfield ----------
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    function spawnStars(n = 1400) {
      stars = [];
      for (let i = 0; i < n; i++) {
        stars.push({
          x: Math.random() * canvas.width - canvas.width / 2,
          y: Math.random() * canvas.height - canvas.height / 2,
          z: Math.random() * 1500,
          size: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.6 + 0.2,
          color: `hsl(${Math.random() * 60 + 200}, 80%, ${Math.random() * 40 + 60}%)`
        });
      }
    }
    let scrollVel = 0;
    let lastY = window.scrollY;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      scrollVel = Math.min(8, Math.max(-8, (y - lastY) * 0.05));
      lastY = y;
    }, { passive: true });

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const speedBoost = 1 + Math.abs(scrollVel) * 0.5;
      for (const s of stars) {
        s.z -= s.speed * speedBoost;
        if (s.z <= 0) {
          s.x = Math.random() * canvas.width - cx;
          s.y = Math.random() * canvas.height - cy;
          s.z = 1500;
        }
        const f = 300 / s.z;
        const sx = s.x * f + cx;
        const sy = s.y * f + cy;
        const sz = Math.max(0.2, s.size * f * 0.5);
        if (sx >= 0 && sx <= canvas.width && sy >= 0 && sy <= canvas.height) {
          const a = Math.max(0.2, 1 - (s.z / 1500));
          ctx.beginPath();
          ctx.arc(sx, sy, sz, 0, Math.PI * 2);
          ctx.fillStyle = s.color;
          ctx.globalAlpha = a;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      // decay scroll velocity so it eases back to normal speed
      scrollVel *= 0.92;
      requestAnimationFrame(draw);
    }
    resize(); spawnStars(); draw();
    window.addEventListener('resize', () => { resize(); spawnStars(); });

    // ---------- Slide data (32 PDF pages) ----------
    const slideTitles = [
      "Mallouk Group",
      "Earlier Business",
      "Automotive Trading & Distributorship",
      "Global Sales & Service Network",
      "Remarkable Achievement — Jordan",
      "Remarkable Achievement in Jordan Market",
      "Distinguished Partnerships",
      "Honors & Awards",
      "Automotive Manufacturing",
      "Automotive Manufacturing",
      "Component Sourcing",
      "Automotive Manufacturing",
      "Strategic Location Advantages",
      "Strategic Location Advantages",
      "Reconstruction Government Tenders",
      "Used Car Trading",
      "Finance Services",
      "Public Transportation Services",
      "Public Transportation Services",
      "Property Development & Construction",
      "Al Shafi Hospital Project",
      "Al TAL Development Project",
      "Phoenix Advanced Systems Ltd",
      "Al Ghad Al Moshreq Hygienic",
      "Renewable Energy — Solar Power Storage",
      "Subsidiaries — Hong Kong / Shanghai / Jiangsu",
      "Future Investment — Reconstruction",
      "Future Investment — Levant University",
      "Future Investment — Fly Syria",
      "Contact Us",
      "Mallouk Group",
      "Thank You"
    ];

    const slidesRoot = document.getElementById('slidesRoot');
    slideTitles.forEach((title, i) => {
      const num = String(i + 1).padStart(2, '0');
      const src = `assets/pages/slide-${num}.jpg`;
      const sec = document.createElement('section');
      sec.className = 'slide';
      sec.setAttribute('data-index', i);
      sec.innerHTML = `
        <div class="nebula-glow"></div>
        <div class="portal-ring" aria-hidden="true"></div>
        <div class="slide-title">
          <span class="num">${num} / 32</span>
          <span class="name">${title}</span>
        </div>
        <div class="slide-card">
          <img src="${src}" alt="${title}" loading="lazy"
               onerror="this.onerror=null; this.src='https://placehold.co/1280x720/0a0a1f/ffffff?text=${encodeURIComponent(title)}';">
        </div>
      `;
      slidesRoot.appendChild(sec);
    });

    // ---------- Scroll animations ----------
    gsap.registerPlugin(ScrollTrigger);
    const slides = document.querySelectorAll('.slide');

    slides.forEach((slide, idx) => {
      const card = slide.querySelector('.slide-card');
      const ring = slide.querySelector('.portal-ring');
      const glow = slide.querySelector('.nebula-glow');
      const titleEl = slide.querySelector('.slide-title');

      // Card travels through the portal: enters small, lands at 1, exits scaling up & fading
      gsap.fromTo(card,
        { opacity: 0, scale: 0.6, y: 80, rotation: -1 },
        {
          opacity: 1, scale: 1, y: 0, rotation: 0,
          ease: 'power2.out',
          scrollTrigger: { trigger: slide, start: 'top 95%', end: 'top 30%', scrub: 1 }
        }
      );
      gsap.to(card, {
        opacity: 0, scale: 1.35, y: -120, rotation: 1,
        ease: 'power2.in',
        scrollTrigger: { trigger: slide, start: 'bottom 80%', end: 'bottom 10%', scrub: 1 }
      });

      // Title bar fade in / out
      gsap.fromTo(titleEl,
        { opacity: 0, y: -20 },
        {
          opacity: 1, y: 0,
          scrollTrigger: { trigger: slide, start: 'top 90%', end: 'top 50%', scrub: 1 }
        }
      );
      gsap.to(titleEl, {
        opacity: 0, y: -20,
        scrollTrigger: { trigger: slide, start: 'bottom 70%', end: 'bottom 30%', scrub: 1 }
      });

      // Portal ring expands then keeps growing as you exit (the "passing through" feel)
      gsap.fromTo(ring,
        { opacity: 0, scale: 0.1 },
        {
          opacity: 0.7, scale: 1.4,
          scrollTrigger: { trigger: slide, start: 'top 95%', end: 'top 25%', scrub: 1 }
        }
      );
      gsap.to(ring, {
        opacity: 0, scale: 5,
        scrollTrigger: { trigger: slide, start: 'top 25%', end: 'bottom -10%', scrub: 1 }
      });

      // Nebula glow brightens at slide center
      gsap.fromTo(glow,
        { opacity: 0 },
        {
          opacity: 0.4,
          scrollTrigger: { trigger: slide, start: 'top 70%', end: 'top 30%', scrub: 1 }
        }
      );
      gsap.to(glow, {
        opacity: 0,
        scrollTrigger: { trigger: slide, start: 'top 30%', end: 'bottom 30%', scrub: 1 }
      });
    });

    // ---------- Progress bar + counter + scroll-hint hide ----------
    const progressBar = document.createElement('div');
    Object.assign(progressBar.style, {
      position: 'fixed', top: '0', left: '0', height: '3px',
      background: 'linear-gradient(90deg, #6C63FF, #00D2FF, #FF6FD8, #00FF87, #FFD700, #FF1493)',
      width: '0%', zIndex: '999', transition: 'width 0.05s linear'
    });
    document.body.appendChild(progressBar);

    const counterEl = document.querySelector('.slide-counter');
    const hintEl = document.querySelector('.scroll-hint');
    function updateProgress() {
      const st = window.pageYOffset;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max ? (st / max) * 100 : 0;
      progressBar.style.width = p + '%';
      const idx = Math.min(slides.length - 1, Math.round(st / window.innerHeight));
      if (counterEl) {
        counterEl.textContent =
          String(idx + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0');
      }
      if (hintEl) hintEl.style.opacity = st > 80 ? '0' : '1';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);

    // ---------- First-load entrance ----------
    window.addEventListener('load', () => {
      const firstCard = slides[0]?.querySelector('.slide-card');
      const firstTitle = slides[0]?.querySelector('.slide-title');
      if (firstCard) gsap.fromTo(firstCard, { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.4, ease: 'power3.out' });
      if (firstTitle) gsap.fromTo(firstTitle, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 1, delay: 0.4, ease: 'power3.out' });
      updateProgress();
      ScrollTrigger.refresh();
    });
  </script>
</body>
</html>
