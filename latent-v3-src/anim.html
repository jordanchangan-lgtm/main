<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#14141A;overflow:hidden}
#st{position:relative;width:var(--w);height:var(--h);overflow:hidden;background:#14141A}
#st>*{position:absolute;left:0;top:0;width:100%;height:100%}
#pic{background:url(IMG) center/cover no-repeat;transform-origin:50% 40%;will-change:transform}
/* the beam: a wide soft ivory band from the top left, screened over the picture */
#beam{mix-blend-mode:screen;opacity:.55;transform-origin:0 0;
  background:linear-gradient(90deg,rgba(242,239,231,0) 0%,rgba(242,239,231,.55) 38%,rgba(242,239,231,.9) 50%,rgba(242,239,231,.55) 62%,rgba(242,239,231,0) 100%);
  filter:blur(28px);width:34%;height:220%;left:-2%;top:-40%}
/* the prism trails: thin ivory cores with marrow fringes, drifting across the lower half */
.tr{mix-blend-mode:screen;opacity:.5;filter:blur(10px);transform-origin:50% 50%;width:160%;left:-30%;height:6%}
#t1{top:58%;background:linear-gradient(180deg,rgba(187,74,46,0) 0%,rgba(187,74,46,.55) 30%,rgba(242,239,231,.95) 50%,rgba(187,74,46,.55) 70%,rgba(187,74,46,0) 100%)}
#t2{top:72%;height:3.5%;background:linear-gradient(180deg,rgba(212,99,63,0) 0%,rgba(242,239,231,.85) 50%,rgba(212,99,63,0) 100%)}
#t3{top:48%;height:2%;opacity:.35;background:linear-gradient(180deg,rgba(242,239,231,0),rgba(242,239,231,.9),rgba(242,239,231,0))}
/* halation bloom that breathes on the lit side */
#bloom{mix-blend-mode:screen;background:radial-gradient(40% 32% at 34% 30%,rgba(242,239,231,.55),rgba(242,239,231,0) 70%);filter:blur(30px)}
#vig{background:radial-gradient(80% 70% at 45% 45%,rgba(20,20,26,0) 45%,rgba(20,20,26,.65) 100%)}
#grain{opacity:.07;background-repeat:repeat;background-size:220px 220px;mix-blend-mode:overlay}
</style></head><body><div id="st">
<div id="pic"></div><div id="beam"></div><div id="t3" class="tr"></div><div id="t1" class="tr"></div><div id="t2" class="tr"></div><div id="bloom"></div><div id="vig"></div><div id="grain"></div>
</div>
<script>
/* every motion is a sine over one 8 s period, so frame 0 and frame N coincide and the loop is seamless */
const P=8;
function noise(seed){return "url(\"data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' seed='"+seed+"'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 1 0'/></filter><rect width='220' height='220' filter='url(#n)'/></svg>")+"\")";}
window.setT=function(t){
  const w=2*Math.PI/P;
  const s=1.035+0.02*Math.sin(w*t), dx=6*Math.sin(w*t+1.1), dy=4*Math.cos(w*t);
  document.getElementById('pic').style.transform=`translate(${dx}px,${dy}px) scale(${s})`;
  const b=document.getElementById('beam'); b.style.transform=`rotate(${-28+2.2*Math.sin(w*t+.6)}deg) translateX(${18*Math.sin(w*t)}px)`; b.style.opacity=.42+.16*Math.sin(w*t+2);
  document.getElementById('t1').style.transform=`translate(${90*Math.sin(w*t)}px,${10*Math.sin(2*w*t)}px) rotate(${-14+3*Math.sin(w*t+.4)}deg) scaleX(${1+.12*Math.sin(w*t+1)})`;
  document.getElementById('t2').style.transform=`translate(${-70*Math.sin(w*t+.8)}px,${14*Math.cos(w*t)}px) rotate(${-9+2*Math.cos(w*t)}deg)`;
  document.getElementById('t3').style.transform=`translate(${50*Math.cos(w*t+.3)}px,0) rotate(${-20+4*Math.sin(w*t)}deg)`;
  document.getElementById('bloom').style.opacity=.7+.3*Math.sin(w*t+.9);
  document.getElementById('grain').style.backgroundImage=noise(1+Math.floor(t*24)%97);
};
setT(0);
</script></body></html>
