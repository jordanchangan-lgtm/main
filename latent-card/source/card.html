<!doctype html><html><head><meta charset="utf-8"><title>Latent Studio · business card</title>
<style>
@font-face{font-family:"Archivo";font-weight:700;src:url("fonts/Archivo_normal_700.woff2") format("woff2")}

@font-face{font-family:"Archivo";font-weight:400;src:url("fonts/Archivo_normal_400.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;src:url("fonts/IBM_Plex_Mono_normal_400.woff2") format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:500;src:url("fonts/IBM_Plex_Mono_normal_500.woff2") format("woff2")}
:root{--ink:#14141A;--ivory:#F2EFE7;--marrow:#BB4A2E;--stone:#8A857B;--bleed:3mm}
*{box-sizing:border-box}
@page{size:91mm 61mm;margin:0}
html,body{margin:0;padding:0;background:#fff;-webkit-font-smoothing:antialiased;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:91mm;height:61mm;position:relative;overflow:hidden;page-break-after:always;break-after:page}
.page:last-child{page-break-after:auto;break-after:auto}
.face{position:absolute;left:var(--bleed);top:var(--bleed);width:85mm;height:55mm}
.front{background:var(--ink);color:var(--ivory)}
.back{background:var(--ivory);color:var(--ink)}
/* wordmark: display grotesk, extra-bold, tracked −4.5%, lowercase, the schwa a letter — small, alone in the dark */
.wm{font-family:"Archivo";font-weight:700;letter-spacing:-.045em;line-height:1;margin:0}
.wm svg{display:inline-block;height:.575em;width:.575em;vertical-align:-0.025em;margin:0 .01em 0 .015em}
.front .wm{position:absolute;left:50%;top:50%;transform:translate(-50%,-56%);font-size:17pt}
/* back: one column, 7 mm inside the trim, everything sits on the bottom margin */
.back .in{position:absolute;left:7mm;top:7mm;right:7mm;bottom:7mm}
.mark{position:absolute;left:0;top:0;width:3.6mm;height:3.6mm;display:block}
.who{position:absolute;left:0;bottom:15.2mm;margin:0}
.name{margin:0;font-family:"Archivo";font-weight:500;font-size:9.5pt;letter-spacing:-.01em;line-height:1}
.title{margin:1.9mm 0 0;font-family:"IBM Plex Mono";font-weight:400;font-size:5.4pt;letter-spacing:.12em;text-transform:uppercase;color:var(--stone)}
.lines{position:absolute;left:0;bottom:0;margin:0;font-family:"IBM Plex Mono";font-weight:400;font-size:5.8pt;letter-spacing:.02em;line-height:1.7;color:var(--ink)}
.lines a{color:inherit;text-decoration:none}
.route{position:absolute;right:0;bottom:0;margin:0;font-family:"IBM Plex Mono";font-size:5.2pt;letter-spacing:.12em;color:var(--stone);line-height:1.7}
</style></head><body>

</div></div></div>
</body></html>
