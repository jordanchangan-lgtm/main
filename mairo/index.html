<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mairo</title>
    <meta name="description" content="Mairo activewear. An asymmetric tank, a racerback bra and wide-leg trousers in four colours." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Aref+Ruqaa&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Hero: looping film, the wordmark pair and one line. -->
    <section class="hero" id="top">
      <div class="hv" aria-hidden="true">
        <video class="hv-v hv-d" muted loop playsinline autoplay preload="auto" poster="assets/hero/hero-poster.jpg">
          <source src="assets/hero/hero-loop.mp4" type="video/mp4" />
        </video>
        <video class="hv-v hv-m" muted loop playsinline autoplay preload="auto" poster="assets/hero/hero-poster-m.jpg">
          <source src="assets/hero/hero-loop-m.mp4" type="video/mp4" />
        </video>
        <i class="hv-grain"></i><i class="hv-grad"></i>
      </div>
      <div class="he">
        <!-- The wordmark pair where the headline was: English above Arabic, centred on each other. -->
        <div class="he-marks js-fade" style="--d:.15s">
          <img class="logo he-en" src="assets/logo/mairo-white.png" alt="Mairo" width="470" height="71" />
          <img class="logo he-ar" src="assets/logo/mairo-ar-white.png" alt="مايرو" width="339" height="113" />
        </div>
        <p class="he-line js-rise" style="--d:.55s" data-i18n="he.line">Activewear in three pieces and four colours.</p>
        <a class="he-br js-rise" href="#collection" style="--d:.8s" data-i18n="he.cta">Who we are &#8595;</a>
      </div>
    </section>

    <header class="head" id="head">
      <nav class="head__nav">
        <a href="shop.html" data-i18n="nav.shop">Shop</a>
        <a href="index.html#collection" data-i18n="nav.sets">About</a>
      </nav>
      <a class="head__mark" href="index.html" aria-label="Mairo">
        <img class="logo" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
      </a>
      <div class="head__util">
        <button type="button" class="js-lang">العربية</button>
        <a href="shop.html" data-bag>Bag (0)</a>
      </div>
    </header>

    <main>

      <!-- Two 2x2 mosaics with the sets; every tile links to that set in the shop. -->
      <section class="mosaic rv" id="collection">
        <div class="mz-grid">
          <a class="mz-tile ph wipe" href="shop.html#red" style="--d:0s">
            <video class="mz-v" muted loop playsinline autoplay preload="metadata" poster="assets/sets/red-a.jpg"><source src="assets/mosaic/red-a.mp4" type="video/mp4" /></video>
          </a>
          <a class="mz-tile ph wipe" href="shop.html#pink" style="--d:.1s">
            <img src="assets/sets/pink-b.jpg" alt="" loading="lazy" />
          </a>
          <a class="mz-tile ph wipe" href="shop.html#cream" style="--d:.15s">
            <img src="assets/sets/cream-b.jpg" alt="" loading="lazy" />
          </a>
          <a class="mz-tile ph wipe" href="shop.html#purple" style="--d:.25s">
            <video class="mz-v" muted loop playsinline autoplay preload="metadata" poster="assets/sets/purple-a.jpg"><source src="assets/mosaic/purple-a.mp4" type="video/mp4" /></video>
          </a>
        </div>
        <div class="mz-mark" aria-hidden="true">
          <img class="logo" src="assets/logo/mairo-white.png" alt="" width="470" height="71" />
        </div>
      </section>

      <!-- One line in the brand's voice. -->
      <section class="line rv">
        <h2 class="line__text hand lift" data-i18n="line.text">Three pieces. Four colours. Nothing crosses.</h2>
      </section>

      <!-- The crouch, full width. -->
      <section class="wide rv">
        <a class="wide__img ph wipe" href="shop.html#purple">
          <img src="assets/sets/purple-wide.jpg" alt="" loading="lazy" />
        </a>
      </section>

      <!-- One button into the shop. -->
      <section class="end rv">
        <span class="coll__eyebrow lift" data-i18n="end.eyebrow">Collection No. 01</span>
        <h2 class="end__title hand lift" style="--d:.08s" data-i18n="end.title">Four sets. Mix them freely.</h2>
        <a class="end__btn lift" style="--d:.18s" href="shop.html" data-i18n="end.btn">Shop the collection</a>
      </section>
    </main>

    <footer class="foot">
      <div class="foot__cols">
        <div class="foot__col">
          <span class="muted" data-i18n="foot.lang">Language</span>
          <button type="button" class="foot__lang" id="lang2">English / العربية</button>
        </div>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.about">About</a></li>
          <li><a href="#" data-i18n="foot.contact">Contact</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.ig">Instagram</a></li>
          <li><a href="#" data-i18n="foot.shipping">Shipping</a></li>
          <li><a href="#" data-i18n="foot.returns">Returns</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.faq">FAQ</a></li>
          <li><a href="#" data-i18n="foot.legal">Legal &amp; Privacy</a></li>
        </ul>
        <form class="foot__col foot__news" onsubmit="return false">
          <label for="email" data-i18n="foot.news">Subscribe to the newsletter</label>
          <div class="foot__field">
            <input id="email" type="email" placeholder="Your email address" data-i18n-ph="foot.email" />
            <button type="submit" aria-label="Subscribe">&gt;</button>
          </div>
        </form>
      </div>
      <!-- English mark bottom-left, Arabic bottom-right. No studio credit. -->
      <div class="foot__base">
        <img class="logo foot__en" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
        <span class="muted">© <span id="year"></span></span>
        <img class="logo foot__ar" src="assets/logo/mairo-ar-black.png" alt="مايرو" width="339" height="113" />
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
