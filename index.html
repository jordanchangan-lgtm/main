<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MALLOUK GROUP — Space Portal Landing</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/slides-data.js"></script>

  <style>
    :root { --bg: #000; --text: #fff; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      overflow-x: hidden;
    }

    #starfield {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }
    /* Very gentle vignette — no hard frame */
    .void-vignette {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.55) 100%);
    }

    /* Slide section is just a 100vh anchor — no border, no overflow clip, no portal frame */
    .slide {
      position: relative;
      width: 100%;
      height: 100vh;
      z-index: 2;
    }

    /* Stage matches PDF aspect ratio so elements land where they did in the deck.
       The stage itself is invisible — no background, no outline, no shadow. */
    .slide-stage {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      /* width and height set by JS based on PDF page aspect & viewport */
    }

    .float-el {
      position: absolute;
      will-change: transform, opacity, filter;
      transform-origin: center center;
      pointer-events: none;
    }

    .float-title {
      font-weight: 700;
      letter-spacing: 0.5px;
      line-height: 1.1;
      color: #fff;
      text-shadow:
        0 0 20px var(--accent1, #6C63FF),
        0 0 50px rgba(0,0,0,0.85);
    }
    .float-text {
      line-height: 1.4;
      color: rgba(255,255,255,0.94);
      text-shadow: 0 2px 10px rgba(0,0,0,0.85), 0 0 20px rgba(0,0,0,0.55);
      font-weight: 400;
    }
    .float-cn {
      line-height: 1.5;
      color: rgba(255,255,255,0.82);
      letter-spacing: 0.3px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.85);
      font-weight: 300;
    }
    .float-img {
      /* soft drop-shadow only — no colored glow that would re-create a card feel */
      filter: drop-shadow(0 12px 35px rgba(0,0,0,0.55));
    }
    .float-img img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      /* no border-radius, no background — let the image be free in space */
    }

    /* Color accents per slide for subtle text glow only */
    .slide:nth-child(15n+1)  { --accent1: #6C63FF; }
    .slide:nth-child(15n+2)  { --accent1: #00D2FF; }
    .slide:nth-child(15n+3)  { --accent1: #FF6FD8; }
    .slide:nth-child(15n+4)  { --accent1: #00FF87; }
    .slide:nth-child(15n+5)  { --accent1: #FFD700; }
    .slide:nth-child(15n+6)  { --accent1: #FF4444; }
    .slide:nth-child(15n+7)  { --accent1: #00FFFF; }
    .slide:nth-child(15n+8)  { --accent1: #FF69B4; }
    .slide:nth-child(15n+9)  { --accent1: #ADFF2F; }
    .slide:nth-child(15n+10) { --accent1: #FF6347; }
    .slide:nth-child(15n+11) { --accent1: #7B68EE; }
    .slide:nth-child(15n+12) { --accent1: #40E0D0; }
    .slide:nth-child(15n+13) { --accent1: #FF1493; }
    .slide:nth-child(15n+14) { --accent1: #00FA9A; }
    .slide:nth-child(15n+15) { --accent1: #DA70D6; }

    .slide-counter {
      position: fixed; top: 14px; left: 14px; z-index: 5;
      color: rgba(255,255,255,0.85);
      font-family: monospace; letter-spacing: 2px;
      background: rgba(0,0,0,0.4);
      padding: 5px 10px; border-radius: 6px;
      font-size: 11px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .scroll-hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      z-index: 5; color: rgba(255,255,255,0.65);
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase;
      animation: bob 2s ease-in-out infinite;
      pointer-events: none;
      transition: opacity 0.6s;
    }
    @keyframes bob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 6px); } }

    /* Mobile: drop the absolute % layout, let elements flow vertically */
    @media (max-width: 760px) {
      .slide { height: auto; min-height: 100vh; padding: 10vh 6vw; }
      .slide-stage {
        position: relative; left: auto; top: auto;
        transform: none;
        width: 100% !important; height: auto !important;
      }
      .float-el {
        position: relative !important;
        left: auto !important; top: auto !important;
        width: 100% !important;
        margin: 12px 0;
      }
      .float-title { font-size: 1.6rem !important; }
      .float-text, .float-cn { font-size: 1rem !important; }
      .float-img { height: auto !important; }
      .float-img img { max-height: 38vh; }
    }
  </style>
</head>
<body>

  <canvas id="starfield"></canvas>
  <div class="void-vignette"></div>

  <div id="slidesRoot"></div>

  <div class="slide-counter">01 / 32</div>
  <div class="scroll-hint">scroll into the void</div>

  <script>
    // ---------- 3D Starfield + Nebula (Three.js) — unchanged ----------
    const canvas = document.getElementById('starfield');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000007, 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000010, 0.00045);

    const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 6000);
    camera.position.set(0, 0, 0);

    const STAR_COUNT = 6000;
    const SPACE_DEPTH = 4500;
    const SPACE_RADIUS = 1400;

    const positions = new Float32Array(STAR_COUNT * 3);
    const colors    = new Float32Array(STAR_COUNT * 3);
    const sizes     = new Float32Array(STAR_COUNT);
    const tmpColor = new THREE.Color();
    for (let i = 0; i < STAR_COUNT; i++) {
      const i3 = i * 3;
      positions[i3]     = (Math.random() - 0.5) * SPACE_RADIUS * 2;
      positions[i3 + 1] = (Math.random() - 0.5) * SPACE_RADIUS * 2;
      positions[i3 + 2] = -Math.random() * SPACE_DEPTH + 200;
      const warm = Math.random() < 0.08;
      const hue = warm ? 0.05 + Math.random() * 0.1 : 0.55 + Math.random() * 0.2;
      tmpColor.setHSL(hue, 0.7, 0.55 + Math.random() * 0.4);
      colors[i3] = tmpColor.r; colors[i3 + 1] = tmpColor.g; colors[i3 + 2] = tmpColor.b;
      sizes[i] = Math.random() * 2.2 + 0.6;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    starGeo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
    starGeo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));

    const starMat = new THREE.ShaderMaterial({
      uniforms: {
        uPixelRatio: { value: renderer.getPixelRatio() },
        uVelocity:   { value: 0.0 },
        uTime:       { value: 0.0 }
      },
      vertexColors: true,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        attribute float aSize;
        varying vec3 vColor;
        varying float vAlpha;
        uniform float uPixelRatio;
        uniform float uVelocity;
        uniform float uTime;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_Position = projectionMatrix * mv;
          float perspective = 320.0 / max(1.0, -mv.z);
          float twinkle = 0.85 + 0.15 * sin(uTime * 2.0 + position.x * 0.3 + position.y * 0.5);
          float warp = 1.0 + abs(uVelocity) * 0.8;
          gl_PointSize = aSize * perspective * uPixelRatio * twinkle * warp;
          vAlpha = clamp(1.0 - smoothstep(2500.0, 5500.0, -mv.z), 0.0, 1.0);
        }
      `,
      fragmentShader: `
        varying vec3 vColor;
        varying float vAlpha;
        void main() {
          vec2 c = gl_PointCoord - 0.5;
          float d = length(c);
          float core  = smoothstep(0.5, 0.0, d);
          float halo  = smoothstep(0.5, 0.15, d) * 0.4;
          float a = (core + halo) * vAlpha;
          gl_FragColor = vec4(vColor, a);
        }
      `
    });
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    function makeNebulaTexture(r, g, b) {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 256;
      const x = cv.getContext('2d');
      const grad = x.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0,    `rgba(${r},${g},${b},0.95)`);
      grad.addColorStop(0.35, `rgba(${r},${g},${b},0.35)`);
      grad.addColorStop(0.7,  `rgba(${r},${g},${b},0.08)`);
      grad.addColorStop(1,    `rgba(${r},${g},${b},0)`);
      x.fillStyle = grad;
      x.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(cv);
    }
    const nebulaPalette = [[108,99,255],[0,210,255],[255,111,216],[0,255,135],[255,80,140],[120,70,220],[40,200,255]];
    const nebulae = [];
    const NEBULA_COUNT = 14;
    for (let i = 0; i < NEBULA_COUNT; i++) {
      const c = nebulaPalette[i % nebulaPalette.length];
      const tex = makeNebulaTexture(c[0], c[1], c[2]);
      const mat = new THREE.SpriteMaterial({ map: tex, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false, opacity: 0.55 });
      const sp = new THREE.Sprite(mat);
      const scale = 800 + Math.random() * 1200;
      sp.scale.set(scale, scale, 1);
      sp.position.set(
        (Math.random() - 0.5) * 1800,
        (Math.random() - 0.5) * 1400,
        -300 - i * (SPACE_DEPTH / NEBULA_COUNT) - Math.random() * 200
      );
      sp.userData.spin = (Math.random() - 0.5) * 0.0008;
      sp.userData.baseOpacity = 0.35 + Math.random() * 0.35;
      sp.material.opacity = sp.userData.baseOpacity;
      scene.add(sp);
      nebulae.push(sp);
    }

    const GAL_COUNT = 1500;
    const galPos = new Float32Array(GAL_COUNT * 3);
    const galCol = new Float32Array(GAL_COUNT * 3);
    const galSiz = new Float32Array(GAL_COUNT);
    for (let i = 0; i < GAL_COUNT; i++) {
      const i3 = i * 3;
      const arm = i % 3;
      const t = Math.random();
      const angle = t * Math.PI * 4 + arm * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.4;
      const r = 60 + t * 520 + (Math.random() - 0.5) * 40;
      galPos[i3]     = Math.cos(angle) * r;
      galPos[i3 + 1] = (Math.random() - 0.5) * 30;
      galPos[i3 + 2] = Math.sin(angle) * r;
      tmpColor.setHSL(0.6 + Math.random() * 0.15, 0.8, 0.55 + Math.random() * 0.3);
      galCol[i3] = tmpColor.r; galCol[i3 + 1] = tmpColor.g; galCol[i3 + 2] = tmpColor.b;
      galSiz[i] = Math.random() * 2 + 0.8;
    }
    const galGeo = new THREE.BufferGeometry();
    galGeo.setAttribute('position', new THREE.BufferAttribute(galPos, 3));
    galGeo.setAttribute('color',    new THREE.BufferAttribute(galCol, 3));
    galGeo.setAttribute('aSize',    new THREE.BufferAttribute(galSiz, 1));
    const galaxy = new THREE.Points(galGeo, starMat);
    galaxy.position.set(-900, 200, -2400);
    galaxy.rotation.x = -0.5;
    galaxy.rotation.z = 0.3;
    scene.add(galaxy);

    let scrollVel = 0;
    let lastY = window.scrollY;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      scrollVel += (y - lastY) * 0.0025;
      scrollVel = Math.max(-3, Math.min(3, scrollVel));
      lastY = y;
    }, { passive: true });

    function getScrollProgress() {
      const max = document.documentElement.scrollHeight - window.innerHeight;
      return max > 0 ? Math.max(0, Math.min(1, window.scrollY / max)) : 0;
    }

    function tick(t) {
      const time = t * 0.001;
      starMat.uniforms.uTime.value = time;
      starMat.uniforms.uVelocity.value = scrollVel;
      const sp = getScrollProgress();
      camera.position.z = -sp * (SPACE_DEPTH - 400);
      camera.position.x = Math.sin(time * 0.07) * 25;
      camera.position.y = Math.cos(time * 0.05) * 18;
      camera.rotation.z = Math.sin(time * 0.1) * 0.03 + scrollVel * 0.04;
      for (const n of nebulae) {
        n.material.rotation += n.userData.spin;
        n.material.opacity = n.userData.baseOpacity * (0.85 + 0.15 * Math.sin(time * 0.4 + n.position.z * 0.001));
      }
      galaxy.rotation.y += 0.0008;
      scrollVel *= 0.92;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      starMat.uniforms.uPixelRatio.value = renderer.getPixelRatio();
    });

    // ---------- Build slides from window.SLIDES (PyMuPDF-positioned) ----------
    const SLIDES = window.SLIDES || [];
    const TOTAL = SLIDES.length;
    const slidesRoot = document.getElementById('slidesRoot');

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    SLIDES.forEach((slide, i) => {
      const sec = document.createElement('section');
      sec.className = 'slide';
      sec.setAttribute('data-index', i);
      sec.dataset.pageW = slide.pageW;
      sec.dataset.pageH = slide.pageH;

      const stage = document.createElement('div');
      stage.className = 'slide-stage';
      stage.dataset.ar = (slide.pageW / slide.pageH).toFixed(4);

      slide.elements.forEach((el, ei) => {
        const div = document.createElement('div');
        div.className = 'float-el ' + (
          el.type === 'title' ? 'float-title' :
          el.type === 'cn'    ? 'float-cn'    :
          el.type === 'img'   ? 'float-img'   : 'float-text'
        );
        div.style.left  = el.x + '%';
        div.style.top   = el.y + '%';
        div.style.width = el.w + '%';
        if (el.type === 'img' && el.h) {
          div.style.height = el.h + '%';
        }
        if (el.fs != null) {
          div.dataset.fs = el.fs;          // PDF point size, used to compute px on layout
        }
        div.dataset.depth = el.depth || 800;
        div.dataset.idx = ei;

        if (el.type === 'img') {
          const img = document.createElement('img');
          img.src = el.src;
          img.loading = 'lazy';
          img.alt = '';
          img.onerror = () => { div.style.display = 'none'; };
          div.appendChild(img);
        } else {
          div.textContent = el.text;
        }
        stage.appendChild(div);
      });

      sec.appendChild(stage);
      slidesRoot.appendChild(sec);
    });

    // ---------- Stage sizing: match PDF aspect to viewport, scale fonts ----------
    function layoutStages() {
      const isMobile = window.innerWidth <= 760;
      if (isMobile) {
        // CSS handles flow layout; only need to clear inline sizes
        document.querySelectorAll('.slide-stage').forEach(s => {
          s.style.width = ''; s.style.height = '';
        });
        document.querySelectorAll('[data-fs]').forEach(el => { el.style.fontSize = ''; });
        return;
      }
      const maxW = window.innerWidth * 0.92;
      const maxH = window.innerHeight * 0.86;
      document.querySelectorAll('.slide-stage').forEach(stage => {
        const ar = parseFloat(stage.dataset.ar) || 1.333;
        let w, h;
        if (maxW / ar <= maxH) { w = maxW; h = maxW / ar; }
        else                   { h = maxH; w = maxH * ar; }
        stage.style.width  = w + 'px';
        stage.style.height = h + 'px';

        const pageWpts = parseFloat(stage.parentElement.dataset.pageW) || 1152;
        stage.querySelectorAll('[data-fs]').forEach(el => {
          const fs = parseFloat(el.dataset.fs);
          // px = pt × stageWidth / pageWidth
          el.style.fontSize = (fs * w / pageWpts).toFixed(2) + 'px';
        });
      });
    }
    layoutStages();
    window.addEventListener('resize', layoutStages);

    // ---------- Continuous emerge-from-void animation per element ----------
    gsap.registerPlugin(ScrollTrigger);

    document.querySelectorAll('.float-el').forEach((el) => {
      const depth = parseFloat(el.dataset.depth) || 800;

      // Each element animates relative to ITSELF (not the slide), so the timing
      // is continuous across the whole page — no per-slide fade cycle.
      gsap.fromTo(el,
        {
          opacity: 0,
          scale: Math.max(0.25, 1 - depth / 2400),
          y: () => Math.min(window.innerHeight * 0.4, depth * 0.18),
          filter: `blur(${Math.min(28, depth / 38)}px)`
        },
        {
          opacity: 1,
          scale: 1,
          y: 0,
          filter: 'blur(0px)',
          ease: 'power2.out',
          scrollTrigger: {
            trigger: el,
            start: 'top bottom',     // start when element top enters viewport
            end:   'top 55%',        // settled by the time element top hits 55% from top
            scrub: 1.2
          }
        }
      );

      // Very gentle trailing fade as element scrolls past viewport top, so it
      // dissolves into the void instead of hard-cutting at the slide boundary.
      gsap.to(el, {
        opacity: 0,
        filter: 'blur(8px)',
        ease: 'power2.in',
        scrollTrigger: {
          trigger: el,
          start: 'bottom 18%',       // begin to dissolve only near top of viewport
          end:   'bottom -10%',
          scrub: 1.2
        }
      });
    });

    // ---------- Progress bar + counter ----------
    const progressBar = document.createElement('div');
    Object.assign(progressBar.style, {
      position: 'fixed', top: '0', left: '0', height: '2px',
      background: 'linear-gradient(90deg, #6C63FF, #00D2FF, #FF6FD8, #00FF87, #FFD700, #FF1493)',
      width: '0%', zIndex: '999', transition: 'width 0.05s linear'
    });
    document.body.appendChild(progressBar);

    const counterEl = document.querySelector('.slide-counter');
    const hintEl = document.querySelector('.scroll-hint');
    function updateProgress() {
      const st = window.pageYOffset;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      const p = max ? (st / max) * 100 : 0;
      progressBar.style.width = p + '%';
      const idx = Math.min(TOTAL - 1, Math.round(st / window.innerHeight));
      if (counterEl) {
        counterEl.textContent =
          String(idx + 1).padStart(2, '0') + ' / ' + String(TOTAL).padStart(2, '0');
      }
      if (hintEl) hintEl.style.opacity = st > 80 ? '0' : '1';
    }
    window.addEventListener('scroll', updateProgress, { passive: true });
    window.addEventListener('resize', updateProgress);

    // ---------- First-load: gentle entrance for first slide's elements ----------
    window.addEventListener('load', () => {
      layoutStages();
      const firstSlide = document.querySelector('.slide');
      const firstFloats = firstSlide ? firstSlide.querySelectorAll('.float-el') : [];
      firstFloats.forEach((el, i) => {
        const depth = parseFloat(el.dataset.depth) || 800;
        gsap.fromTo(el,
          {
            opacity: 0,
            scale: Math.max(0.25, 1 - depth / 2400),
            y: depth * 0.12,
            filter: `blur(${Math.min(28, depth / 38)}px)`
          },
          {
            opacity: 1, scale: 1, y: 0, filter: 'blur(0px)',
            duration: 1.6,
            delay: 0.08 * i,
            ease: 'power3.out'
          }
        );
      });
      updateProgress();
      ScrollTrigger.refresh();
    });
  </script>
</body>
</html>
