name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages whenever the dev branch is updated.
# Also runnable on demand via the "Run workflow" button in the Actions tab.

on:
  push:
    branches:
      - claude/landing-page-scroll-animations-3wBAL
  workflow_dispatch:

# Permissions required by the GitHub-Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; new pushes cancel any in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root is the site (index.html lives here)
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
