<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mairo — Shop</title>
    <meta name="description" content="Mairo. Collection 01." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=Aref+Ruqaa&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="head" id="head">
      <nav class="head__nav">
        <a href="shop.html" data-i18n="nav.shop">Shop</a>
        <a href="index.html#collection" data-i18n="nav.sets">About</a>
      </nav>
      <a class="head__mark" href="index.html" aria-label="Mairo">
        <img class="logo" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
      </a>
      <div class="head__util">
        <button type="button" class="js-lang">العربية</button>
        <a href="shop.html" data-bag>Bag (0)</a>
      </div>
    </header>

    <main class="shop-page">
      <section class="sh-intro rv">
        <span class="coll__eyebrow lift" data-i18n="shop.eyebrow">Collection No. 01</span>
        <h1 class="sh-intro__title hand lift" style="--d:.08s" data-i18n="shop.title">The shop</h1>
        <p class="sh-intro__lede lift" style="--d:.16s" data-i18n="shop.lede">Four sets, three pieces in each. Take the whole set or one piece.</p>
        <nav class="sh-tabs lift" style="--d:.24s">
          <a href="#red" data-i18n="c.red">Red</a>
          <a href="#cream" data-i18n="c.cream">Cream</a>
          <a href="#pink" data-i18n="c.pink">Pink</a>
          <a href="#purple" data-i18n="c.purple">Purple</a>
        </nav>
      </section>
      <div id="shopSets"></div>
    </main>

    <footer class="foot">
      <div class="foot__cols">
        <div class="foot__col">
          <span class="muted" data-i18n="foot.lang">Language</span>
          <button type="button" class="foot__lang" id="lang2">English / العربية</button>
        </div>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.about">About</a></li>
          <li><a href="#" data-i18n="foot.contact">Contact</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.ig">Instagram</a></li>
          <li><a href="#" data-i18n="foot.shipping">Shipping</a></li>
          <li><a href="#" data-i18n="foot.returns">Returns</a></li>
        </ul>
        <ul class="foot__col">
          <li><a href="#" data-i18n="foot.faq">FAQ</a></li>
          <li><a href="#" data-i18n="foot.legal">Legal &amp; Privacy</a></li>
        </ul>
        <form class="foot__col foot__news" onsubmit="return false">
          <label for="email" data-i18n="foot.news">Subscribe to the newsletter</label>
          <div class="foot__field">
            <input id="email" type="email" placeholder="Your email address" data-i18n-ph="foot.email" />
            <button type="submit" aria-label="Subscribe">&gt;</button>
          </div>
        </form>
      </div>
      <!-- English mark bottom-left, Arabic bottom-right. No studio credit. -->
      <div class="foot__base">
        <img class="logo foot__en" src="assets/logo/mairo-black.png" alt="Mairo" width="470" height="71" />
        <span class="muted">© <span id="year"></span></span>
        <img class="logo foot__ar" src="assets/logo/mairo-ar-black.png" alt="مايرو" width="339" height="113" />
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
